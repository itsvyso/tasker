name: Build Unsigned IPA
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS Runner OS'
        required: true
        default: 'macos-15'
        type: choice
        options:
          - 'macos-15'
          - 'macos-14'
          - 'macos-latest'

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies, build Vite and sync Capacitor
        run: npm ci && npm run build && npx cap sync ios
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://fikwumoyevcaodcoflpc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_Pscx3-35NonP9170_KwnFA_t7tZDunV' }}
      - name: Build Xcode Archive
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_CMD="xcodebuild -workspace ios/App/App.xcworkspace"
          else
            BUILD_CMD="xcodebuild -project ios/App/App.xcodeproj"
          fi
          $BUILD_CMD \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r Taske.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Taske-IPA
          path: Taske.ipa

